name: go-template

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-template-app
    env_file:
      - .env
    environment:
      DATABASE_URL: host=database port=5432 user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:-postgres} dbname=${POSTGRES_DB:-myapp} sslmode=disable
    ports:
      - ${PORT:-3000}:${PORT:-3000}
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    container_name: go-template-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-myapp}
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-myapp}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
